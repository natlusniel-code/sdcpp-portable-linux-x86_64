name: build-portable

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install cmake
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake build-essential

      - name: Clone stable-diffusion.cpp
        run: |
          git clone --depth 1 https://github.com/leejet/stable-diffusion.cpp.git src
          cd src && git submodule update --init --recursive

      - name: Build
        run: |
          cd src
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target sd-cli -j 4

      - name: Package
        run: |
          mkdir -p dist
          find src/build -name "sd-cli" -type f -exec cp {} dist/ \;
          find src/build -name "*.so*" -type f -exec cp {} dist/ \;
          printf '#!/bin/bash\nDIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"\nexport LD_LIBRARY_PATH="$DIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"\nexec "$DIR/sd-cli" "$@"\n' > dist/sd
          chmod +x dist/sd
          ls -la dist
          tar czf sdcpp-linux-x86_64.tar.gz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: sdcpp-linux-x86_64
          path: sdcpp-linux-x86_64.tar.gz
